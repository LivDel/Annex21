# Annex21 local infra
#
# RG-10 — Data in-EU (obligatoire) :
#   Postgres, Redis et MinIO stockent des données tenant (orgs, preuves, sessions).
#   En production : régions EU uniquement (ex. eu-west-1 / eu-central-1 / Paris / Francfort).
#   Backups, replicas et logs applicatifs sensibles : même contrainte.
#   Ne PAS déployer ces volumes hors UE.
#
# Démarrage : docker compose -f infra/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: annex21-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: annex21
      POSTGRES_USER: annex21
      POSTGRES_PASSWORD: changeme_local_only
      # Timezone org + horodatage UTC (RG-04)
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - annex21_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annex21 -d annex21"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      annex21.data_residency: "EU"

  redis:
    image: redis:7-alpine
    container_name: annex21-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - annex21_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      annex21.data_residency: "EU"

  # Object storage S3-compatible pour les preuves (evidence).
  # RG-08 / RG-11 : jamais exposé sur le Trust Center public.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: annex21-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: annex21
      MINIO_ROOT_PASSWORD: changeme_local_only
      # Région logique EU — en prod, cluster MinIO / S3 EU only
      MINIO_REGION: eu-west-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - annex21_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      annex21.data_residency: "EU"

volumes:
  annex21_pgdata:
  annex21_redis:
  annex21_minio:
